name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      require_complete:
        description: Fail unless 43U code, data, functions, units, and links are all 100%
        required: false
        default: false
        type: boolean

jobs:
  build:
    # This is a *private* build container.
    container: ghcr.io/koopthekoopa/wii-ipl-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [43U]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Normalize file mod times
    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
            --merge --commit-time

    # Copy the original files to the workspace
    - name: Prepare
      run: cp -a /orig .

    # Restore cached files
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build
          .ninja_deps
          .ninja_log
        key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ matrix.version }}-

    # Build the project
    - name: Build
      run: |
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja all_source progress build/${{ matrix.version }}/report.json

    - name: Test workflow guards
      run: python tools/test_workflow_guards.py

    - name: Calculate decomp status
      if: matrix.version == '43U'
      run: |
        python tools/decomp_status.py \
            build/${{ matrix.version }}/report.json \
            --output build/${{ matrix.version }}/decomp-status.json \
            --summary "$GITHUB_STEP_SUMMARY"

    - name: Enforce completion gate
      if: matrix.version == '43U' && github.event_name == 'workflow_dispatch' && inputs.require_complete == true
      run: |
        python tools/check_decomp_complete.py \
            build/${{ matrix.version }}/report.json \
            --dol build/${{ matrix.version }}/main.dol

    # Upload map files
    - name: Upload map
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    # Upload progress report
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json

    - name: Upload decomp status
      if: always() && matrix.version == '43U'
      uses: actions/upload-artifact@v4
      with:
        name: decomp_status
        path: build/${{ matrix.version }}/decomp-status.json
