name: README progress

# runs on the self-hosted runner on cole's server so it doesn't use hosted minutes.
# only push/schedule/manual triggers, never pull_request, so fork PRs can't reach this machine.
# it never commits to main: it rebuilds, publishes the numbers to the job summary, and force-pushes
# the README badge JSON as a single commit on the orphan progress-data branch.
on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: readme-progress
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  progress:
    runs-on: [self-hosted, wii-ipl-local]
    timeout-minutes: 60
    env:
      ORIG_APP: /mnt/drive2/projects/wiichannels/wii-ipl/orig/43U/00000008.app
      TOOL_CACHE: /mnt/drive2/projects/wiichannels/wii-ipl/build
      NINJA: /home/cole/projects/tests/.venv/bin/ninja
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare
        run: |
          mkdir -p build orig/43U
          cp "$ORIG_APP" orig/43U/00000008.app
          [ -d build/compilers ] || cp -a "$TOOL_CACHE/compilers" build/
          [ -d build/tools ] || cp -a "$TOOL_CACHE/tools" build/

      - name: Build
        run: |
          python3 configure.py --version 43U
          "$NINJA"
          "$NINJA" build/43U/ok

      - name: Report
        run: build/tools/objdiff-cli report generate -p . -o build/43U/report.json -f json

      - name: Summary
        run: |
          python3 tools/update_readme_progress.py build/43U/report.json README.md "$GITHUB_SHA"
          sed -n '/progress:start/,/progress:end/p' README.md >> "$GITHUB_STEP_SUMMARY"
          git checkout -- README.md

      - name: Publish badges
        if: github.ref == 'refs/heads/main'
        run: |
          out="$RUNNER_TEMP/progress-data"
          rm -rf "$out"
          python3 tools/progress_badges.py build/43U/report.json "$out"
          cd "$out"
          git init -q -b progress-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "progress for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/progress-data
